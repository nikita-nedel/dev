# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            Symfony\Component\Security\Http\Authenticator\FormLoginAuthenticator $customerFormLoginAuthenticator: '@security.authenticator.form_login.main'
            Symfony\Component\Security\Http\Authenticator\FormLoginAuthenticator $adminFormLoginAuthenticator: '@security.authenticator.form_login.admin'
            Symfony\Component\Security\Http\Authenticator\FormLoginAuthenticator $sellerFormLoginAuthenticator: '@security.authenticator.form_login.seller'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/*/Domain/'
            - '../src/Kernel.php'

    App\Shared\Domain\Port\ClockInterface:
        alias: App\Shared\Infrastructure\Clock\SystemClock

    App\Shared\Domain\Port\TransactionManagerInterface:
        alias: App\Shared\Infrastructure\Doctrine\DoctrineTransactionManager

    App\Shared\Domain\Port\PasswordHasherInterface:
        alias: App\Shared\Infrastructure\Security\SymfonyPasswordHasher

    App\Process\Domain\Repository\JobRepositoryInterface:
        alias: App\Process\Infrastructure\Doctrine\Repository\DoctrineJobRepository

    App\Identity\Domain\Repository\CustomerRepositoryInterface:
        alias: App\Identity\Infrastructure\Doctrine\Repository\DoctrineCustomerRepository

    App\Identity\Domain\Repository\SellerRepositoryInterface:
        alias: App\Identity\Infrastructure\Doctrine\Repository\DoctrineSellerRepository

    App\Identity\Domain\Repository\AdminRepositoryInterface:
        alias: App\Identity\Infrastructure\Doctrine\Repository\DoctrineAdminRepository

    App\Identity\Domain\Repository\AdminInviteRepositoryInterface:
        alias: App\Identity\Infrastructure\Doctrine\Repository\DoctrineAdminInviteRepository

    App\Export\Domain\Repository\ExportFileRepositoryInterface:
        alias: App\Export\Infrastructure\Doctrine\Repository\DoctrineExportFileRepository

    _instanceof:
        App\Export\Application\Port\ExportDataProviderInterface:
            tags: [ 'app.export.data_provider' ]
        App\Export\Application\Port\ExportWriterInterface:
            tags: [ 'app.export.writer' ]
        App\Export\Application\Port\ExportCriteriaFactoryInterface:
            tags: [ 'app.export.criteria_factory' ]

    App\Export\Application\Criteria\ExportCriteriaResolver:
        arguments:
            $factories: !tagged_iterator app.export.criteria_factory

    App\Export\Application\Command\RunExport\RunExportHandler:
        arguments:
            $dataProviders: !tagged_iterator app.export.data_provider
            $writers: !tagged_iterator app.export.writer
            $projectDir: '%kernel.project_dir%'
