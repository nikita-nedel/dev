# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    Symfony\Component\Security\Http\Authenticator\FormLoginAuthenticator:
        alias: 'security.authenticator.form_login.main'
        public: true

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    _instanceof:
        App\Export\Contract\ExportDataProviderInterface:
            tags: [ 'app.export.data_provider' ]
        App\Export\Contract\ExportWriterInterface:
            tags: [ 'app.export.writer' ]
        App\Export\Contract\ExportCriteriaFactoryInterface:
            tags: [ 'app.export.criteria_factory' ]

    App\Service\Export\ExportService:
        arguments:
            $dataProviders: !tagged_iterator app.export.data_provider
            $writers: !tagged_iterator app.export.writer

    App\Resolver\Export\ExportCriteriaResolver:
        arguments:
            $factories: !tagged_iterator app.export.criteria_factory
