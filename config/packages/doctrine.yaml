doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            # Каждый контекст объявляет свои сущности отдельной записью...
            # (единый App\Entity больше не используется — он остался в истории)
            Process:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Process/Domain/Model'
                prefix: 'App\Process\Domain\Model'
            Export:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Export/Domain/Model'
                prefix: 'App\Export\Domain\Model'
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Model'
                prefix: 'App\Identity\Domain\Model'
            Seller:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Seller/Domain/Model'
                prefix: 'App\Seller\Domain\Model'
        controller_resolver:
            auto_mapping: false
        dql:
            string_functions:
                JSONB_CONTAINS: Scienta\DoctrineJsonFunctions\Query\AST\Functions\Postgresql\JsonbContains

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
