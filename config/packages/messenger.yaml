framework:
    messenger:
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            sync: 'sync://'
            async:
              dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
              options:
                exchange:
                  name: app
                  type: direct
                  default_publish_routing_key: export.client
                queues:
                  async_export:
                    binding_keys:
                      - export.client
                confirm_timeout: 5
              retry_strategy:
                max_retries: 3
                delay: 1000
                multiplier: 2
                max_delay: 30000

        routing:
            App\Export\Application\Command\RunExport\RunExportMessage: async
