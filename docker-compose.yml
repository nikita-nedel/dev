x-worker-base: &worker-base
  build:
    context: ./docker/php
    target: ${APP_ENV:-0}
    args:
      USER_ID: ${USER_ID:-0}
  volumes:
    - ./:/app
  depends_on:
    - base-db
    - rabbitmq
  restart: unless-stopped

services:
  nginx:
    build:
      context: ./docker/nginx
    volumes:
      - ./:/app
    ports:
      - '8001:80'
    depends_on:
      - php
  php:
    build:
      context: ./docker/php
      target: ${APP_ENV:-0}
      args:
        USER_ID: ${USER_ID:-0}
    volumes:
      - ./:/app
    depends_on:
      - base-db
  base-db:
    restart: always
    image: postgres:16.1-alpine3.19
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - "POSTGRES_USER=db_user"
      - "POSTGRES_PASSWORD=db_password"
      - "POSTGRES_DB=db_name"
    ports:
      - "33070:5432"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  export-worker:
    <<: *worker-base
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M --sleep=1 -vv
