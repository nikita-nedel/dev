deptrac:
  paths:
    - ./src
  exclude_files:
    - '#src/Kernel\.php#'
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: 'src/.*/Domain/.*'
    - name: Application
      collectors:
        - type: directory
          value: 'src/.*/Application/.*'
    - name: Infrastructure
      collectors:
        - type: directory
          value: 'src/.*/Infrastructure/.*'
    - name: Presentation
      collectors:
        - type: directory
          value: 'src/.*/Presentation/.*'
  ruleset:
    Domain: []
    Application:
      - Domain
    Infrastructure:
      - Domain
      - Application
    Presentation:
      - Domain
      - Application

  skip_violations:
    App\Dashboard\Presentation\Http\DashboardController:
      - App\Dashboard\Infrastructure\Demo\DemoDashboardData
    App\Identity\Presentation\Http\Controller\ProfileController:
      - App\Identity\Infrastructure\Demo\DemoProfileData
